<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover">
    <title>Pagamento pendente - Condomit</title>
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../styles/theme.css?v=0151">
    <link rel="stylesheet" href="../styles/checkout.css">
    <link rel="stylesheet" href="../styles/responsive-mobile.css?v=034">
    <link rel="manifest" href="../manifest.webmanifest">
</head>
<body class="payment-result-page">
    <main class="payment-result-card pending" data-payment-result data-status="pending">
        <div class="payment-result-icon">
            <i class="fas fa-clock"></i>
        </div>
        <h1 id="payment-result-title">Pagamento em analise</h1>
        <p id="payment-result-description">Estamos consultando o retorno do Mercado Pago para atualizar sua assinatura.</p>
        <div class="payment-result-status" id="payment-result-status">
            <strong>Status atual</strong>
            <span>Aguardando a confirmacao final do pagamento.</span>
        </div>
        <div class="payment-result-actions">
            <a class="primary" id="payment-result-primary" href="checkout.html">Voltar ao checkout</a>
            <a class="secondary" id="payment-result-secondary" href="entrar.html">Ir para o login</a>
            <button class="secondary" id="payment-result-refresh" type="button">Atualizar status</button>
        </div>
    </main>

    <script src="../assets/js/retorno-mercado-pago.js"></script>
    <script src="../scripts/platform-config.js?v=034"></script>

    <script src="../scripts/condomit-alerts.js?v=014"></script>
    <script src="../scripts/advanced-global.js?v=034"></script>
</body>
</html>
