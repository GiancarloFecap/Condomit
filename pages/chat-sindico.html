<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condomit - Chat com o Síndico</title>
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../styles/index.css?v=011">
    <link rel="stylesheet" href="../styles/theme.css">
    <link rel="stylesheet" href="../styles/chat.css">
</head>
<body>
    <div class="dashboard-sindico">
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="../assets/Logo-Lado.png" alt="Condomit Icon" class="sidebar-logo">
                <h2 class="condo-name" id="sidebarApartment"></h2>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="top-bar-left">
                    <h1>Chat com o Síndico</h1>
                    <p>Fale diretamente com o síndico do seu condomínio.</p>
                </div>
                <div class="top-bar-right">
                    <div class="top-icons">
                        <button class="icon-btn" type="button" aria-label="Buscar"><i class="fas fa-search"></i></button>
                        <button class="icon-btn" type="button" aria-label="Notificações"><i class="fas fa-bell"></i></button>
                        <button class="icon-btn" type="button" id="topUserBtn" aria-label="Editar perfil"><i class="fas fa-user"></i></button>
                    </div>
                    <div class="user-profile-small" id="topProfileBlock">
                        <div class="user-info-small">
                            <div class="name" id="profileNameTop">Usuário</div>
                            <div class="type" id="profileTypeTop">Morador</div>
                        </div>
                        <div class="avatar" id="profileAvatarTop">US</div>
                    </div>
                </div>
            </header>

            <section class="chat-page">
                <div class="chat-single-layout">
                    <div class="chat-panel chat-main">
                        <div class="chat-header">
                            <div class="chat-header-left">
                                <div class="chat-avatar-lg">
                                    JS
                                    <span class="status-dot"></span>
                                </div>
                                <div class="chat-header-info">
                                    <h3 class="chat-header-name">João Silva</h3>
                                    <p class="chat-header-detail">
                                        <span class="status-indicator">● Síndico • Online agora</span>
                                    </p>
                                </div>
                            </div>
                            <div class="chat-header-actions">
                                <button class="icon-chat-btn" type="button" title="Ligar"><i class="fas fa-phone"></i></button>
                                <button class="icon-chat-btn" type="button" title="Vídeo chamada"><i class="fas fa-video"></i></button>
                                <button class="icon-chat-btn" type="button" title="Mais opções"><i class="fas fa-ellipsis-v"></i></button>
                            </div>
                        </div>
                        <div class="messages-container" id="messagesContainer">
                            <div class="message-divider">
                                <span>Hoje</span>
                            </div>
                        </div>
                        <div class="chat-input-area">
                            <div class="chat-input-wrapper">
                                <button class="chat-tool-btn" type="button" title="Anexar arquivo"><i class="fas fa-paperclip"></i></button>
                                <button class="chat-tool-btn" type="button" title="Emoji"><i class="fas fa-face-smile"></i></button>
                                <textarea class="chat-textarea" id="chatInput" placeholder="Digite sua mensagem..." rows="1"></textarea>
                                <button class="chat-send-btn" id="sendBtn" type="button" title="Enviar"><i class="fas fa-paper-plane"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="../scripts/supabase-client.js"></script>
    <script src="../scripts/sidebar-links.js?v=011"></script>
    <script src="../scripts/chat-sindico.js"></script>
    <script src="../scripts/topbar-actions.js?v=011"></script>
</body>
</html>
