<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Condomit - Controle de Prestadores</title>
<link href="../assets/favicon.png" rel="icon" type="image/png"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
<link href="../styles/index.css?v=053" rel="stylesheet"/>
<link href="../styles/theme.css?v=044" rel="stylesheet"/>
<link href="../styles/porteiro-acessos.css?v=065" rel="stylesheet"/>
<link href="../styles/responsive-mobile.css?v=035" rel="stylesheet"/>
<link href="../manifest.webmanifest" rel="manifest"/>
<link href="../styles/ux-polish.css?v=0720" rel="stylesheet"/>
<link href="../styles/sidebar-account-navigation.css?v=056" rel="stylesheet"/>
<meta content="noindex, nofollow" name="robots"/>
<link href="../styles/ui-refinement-071.css" rel="stylesheet"/></head>
<body class="condomit-no-topbar condomit-app-page">
<div class="dashboard-sindico">
<aside class="sidebar porteiro-sidebar">
<div class="sidebar-header">
<img alt="Condomit Icon" class="sidebar-logo" src="../assets/logo-lado.png"/>
<h2 class="condo-name" id="sidebarApartment"></h2>
</div>
</aside>
<main class="main-content">
<section class="access-page provider-page">
<div class="metrics-row">
<article class="metric-card success">
<div class="metric-head">
<div class="metric-icon"><i class="fas fa-users-gear"></i></div>
<div>
<div class="metric-label">Prestadores ativos</div>
<div class="metric-value" id="activeProvidersCount">0</div>
</div>
</div>
</article>
<article class="metric-card accent">
<div class="metric-head">
<div class="metric-icon"><i class="fas fa-clock"></i></div>
<div>
<div class="metric-label">Agendados para hoje</div>
<div class="metric-value" id="scheduledProvidersCount">0</div>
</div>
</div>
</article>
<article class="metric-card pending">
<div class="metric-head">
<div class="metric-icon"><i class="fas fa-clipboard-list"></i></div>
<div>
<div class="metric-label">Serviços em andamento</div>
<div class="metric-value" id="inProgressProvidersCount">0</div>
</div>
</div>
</article>
<article class="metric-card danger">
<div class="metric-head">
<div class="metric-icon"><i class="fas fa-circle-xmark"></i></div>
<div>
<div class="metric-label">Inadimplentes</div>
<div class="metric-value" id="blockedProvidersCount">0</div>
</div>
</div>
</article>
</div>
<div class="provider-grid">
<section class="panel-card">
<div class="toolbar">
<div class="toolbar-left">
<label class="search-field">
<i class="fas fa-magnifying-glass"></i>
<input id="providerSearchInput" placeholder="Buscar por nome, empresa ou serviço..." type="search"/>
</label>
</div>
<div class="toolbar-right">
<label class="select-field">
<select id="providerStatusFilter">
<option value="all">Todos os status</option>
<option value="active">Ativos</option>
<option value="scheduled">Agendados</option>
<option value="in_progress">Em andamento</option>
<option value="inactive">Inativos</option>
<option value="blocked">Bloqueados</option>
</select>
</label>
<label class="select-field">
<select id="providerCategoryFilter">
<option value="all">Todas as categorias</option>
</select>
</label>
<label class="date-field">
<i class="fas fa-calendar-day"></i>
<input id="providerDateFilter" type="date"/>
</label>
<button class="filter-btn" id="clearProviderFiltersBtn" type="button">
<i class="fas fa-filter-circle-xmark"></i>
<span>Limpar filtros</span>
</button>
</div>
</div>
<div class="status-tabs" id="providerTabs">
<button class="status-tab active" data-tab="all" type="button">Todos</button>
<button class="status-tab" data-tab="active" type="button">Ativos</button>
<button class="status-tab" data-tab="scheduled" type="button">Agendados</button>
<button class="status-tab" data-tab="in_progress" type="button">Em andamento</button>
<button class="status-tab" data-tab="inactive" type="button">Inativos</button>
<button class="status-tab" data-tab="blocked" type="button">Bloqueados</button>
</div>
<div class="table-wrap">
<table class="access-table provider-table">
<thead>
<tr>
<th>Prestador</th>
<th>Empresa / Serviço</th>
<th>Categoria</th>
<th>Contato</th>
<th>Entrada / Saída</th>
<th>Status</th>
<th>Ações</th>
</tr>
</thead>
<tbody id="providerTableBody"></tbody>
</table>
</div>
<div class="section-footer">
<span class="records-note" id="providerSummary">Mostrando 0 prestadores</span>
<label class="select-field">
<select id="providerPageSize">
<option value="10">10 por página</option>
<option value="20">20 por página</option>
</select>
</label>
</div>
</section>
<aside class="sidebar-stack">
<section class="side-card">
<h3>Categorias</h3>
<ul class="category-list" id="providerCategoryList"></ul>
</section>
</aside>
</div>
</section>
</main>
</div>
<div aria-hidden="true" class="modal-backdrop delivery-modal" id="providerModal">
<div aria-labelledby="providerModalTitle" aria-modal="true" class="delivery-modal-card provider-modal-card" role="dialog">
<div class="delivery-modal-header">
<div>
<h2 id="providerModalTitle">Novo prestador</h2>
<p>Cadastre um prestador para o condomínio atual.</p>
</div>
<button aria-label="Fechar modal" class="icon-more" id="closeProviderModalBtn" type="button">
<i class="fas fa-times"></i>
</button>
</div>
<div class="delivery-modal-body">
<form class="delivery-form" id="providerForm">
<div class="delivery-form-row">
<label>
<span>Nome do prestador</span>
<input id="providerName" placeholder="Nome completo" required="" type="text"/>
</label>
<label>
<span>Empresa</span>
<input id="providerCompany" placeholder="Empresa ou autônomo" required="" type="text"/>
</label>
</div>
<div class="delivery-form-row">
<label>
<span>Serviço</span>
<input id="providerService" placeholder="Ex: Instalação elétrica" required="" type="text"/>
</label>
<label>
<span>Categoria</span>
<select id="providerCategory" required="">
<option value="electrical">Elétrica</option>
<option value="cleaning">Limpeza</option>
<option value="hydraulic">Hidráulica</option>
<option value="security">Segurança</option>
<option value="gardening">Jardinagem</option>
<option value="painting">Pintura</option>
<option value="elevator">Elevadores</option>
</select>
</label>
</div>
<div class="delivery-form-row">
<label>
<span>Telefone</span>
<input id="providerPhone" placeholder="(11) 99999-9999" required="" type="text"/>
</label>
<label>
<span>E-mail</span>
<input id="providerEmail" placeholder="prestador@email.com" required="" type="email"/>
</label>
</div>
<div class="delivery-form-row">
<label>
<span>Data do atendimento</span>
<input id="providerVisitDate" required="" type="date"/>
</label>
<label>
<span>Janela do atendimento</span>
<input id="providerVisitWindow" placeholder="Ex: 08:00 - 12:00" required="" type="text"/>
</label>
</div>
<label>
<span>Status inicial</span>
<select id="providerInitialStatus" required="">
<option value="agendado">Agendado</option>
<option value="em andamento">Em andamento</option>
<option value="concluído">Concluído</option>
<option value="cancelado">Cancelado</option>
</select>
</label>
<div class="provider-feedback" id="providerFeedback"></div>
<div class="delivery-modal-actions">
<button class="ghost-outline provider-cancel-btn" id="cancelProviderBtn" type="button"><i class="fas fa-xmark"></i><span>Cancelar</span></button>
<button class="soft-action" type="submit">
<i class="fas fa-check"></i>
<span>Salvar prestador</span>
</button>
</div>
</form>
</div>
</div>
</div>
<script src="../scripts/platform-config.js?v=035"></script>
<script src="../scripts/supabase-client.js?v=065"></script>
<script src="../scripts/supabase-auth.js?v=061" type="module"></script>
<script src="../scripts/sidebar-links.js?v=065"></script>
<script src="../scripts/porteiro-topbar.js?v=035"></script>
<script src="../scripts/controle-prestadores.js?v=011"></script>
<script src="../scripts/topbar-actions.js?v=065"></script>
<script src="../scripts/condomit-alerts.js?v=057"></script>
<script src="../scripts/responsive-nav.js?v=025"></script>
<script src="../scripts/advanced-global.js?v=065"></script>
</body>
</html>
