<!doctype html>
<html lang="pt-BR" data-pagamento-status="failure">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Pagamento não aprovado - Condomit</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../styles/theme.css">
    <link rel="stylesheet" href="../styles/checkout.css">
    <style>
        .resultado-pagamento {
            min-height: calc(100vh - 80px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }
        .resultado-pagamento .icon-box {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: #fee2e2;
            color: #dc2626;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            margin-bottom: 32px;
            box-shadow: 0 10px 25px rgba(220, 38, 38, 0.15);
        }
        .resultado-pagamento h1 {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 12px;
        }
        .resultado-pagamento p {
            font-size: 1.05rem;
            color: var(--text-muted);
            margin-bottom: 32px;
            line-height: 1.6;
        }
        .resultado-pagamento button {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 15px 48px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(30, 64, 175, 0.2);
        }
        .resultado-pagamento button:hover {
            background: var(--secondary-blue);
            transform: translateY(-1px);
        }
        .dicas-lista {
            background: var(--white);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 32px;
            border: 1px solid var(--border);
            width: 100%;
            text-align: left;
        }
        .dicas-lista h3 {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .dicas-lista ul {
            list-style: none;
            padding: 0;
        }
        .dicas-lista li {
            padding: 8px 0;
            color: var(--text-main);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .dicas-lista li i {
            color: var(--primary-blue);
        }
    </style>
</head>
<body>
    <main class="resultado-pagamento">
        <div class="icon-box">
            <i class="fas fa-times-circle"></i>
        </div>
        <h1>Pagamento não aprovado</h1>
        <p>Não foi possível concluir o pagamento. Tente novamente ou utilize outro meio de pagamento.</p>
        <div class="dicas-lista">
            <h3>Possíveis motivos</h3>
            <ul>
                <li><i class="fas fa-info-circle"></i> Dados do cartão incorretos</li>
                <li><i class="fas fa-info-circle"></i> Saldo ou limite insuficiente</li>
                <li><i class="fas fa-info-circle"></i> Compra bloqueada pelo banco emissor</li>
                <li><i class="fas fa-info-circle"></i> Cartão vencido ou cancelado</li>
            </ul>
        </div>
        <button type="button" id="btn-continuar">
            Tentar novamente
        </button>
    </main>
    <script>
        (function () {
            const btn = document.getElementById('btn-continuar');
            if (btn) {
                btn.addEventListener('click', function() {
                    if (typeof window.fecharRetornoMercadoPago === 'function') {
                        fecharRetornoMercadoPago();
                    } else {
                        const cached = sessionStorage.getItem('condominiumUser');
                        if (cached) {
                            const u = JSON.parse(cached);
                            if (u.type === 'morador') location.href = 'index-morador.html';
                            else location.href = 'checkout.html';
                        } else {
                            location.href = 'entrar.html';
                        }
                    }
                });
            }
        })();
    </script>
    <script src="../assets/js/retorno-mercado-pago.js"></script>
</body>
</html>
