<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Assembleias - Cadastro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../styles/cadastro.css">
    <link rel="stylesheet" href="../styles/theme.css">
</head>
<body>
    <div class="signup-page">
        <div class="signup-container">
            <button class="btn-back" onclick="window.history.back()">
                <i class="fas fa-arrow-left"></i> Voltar
            </button>
            <div class="signup-header">
                <img src="../assets/logo-full.png" alt="CondoSmart Logo" class="signup-logo">
                <h1>Crie sua conta</h1>
                <p>É necessário preencher corretamente e criar um termo depois</p>
            </div>
            <form id="signupForm" class="signup-form">
                <div class="form-group">
                    <label for="name">Nome completo</label>
                    <input type="text" id="name" placeholder="Digite seu nome completo" required>
                </div>
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail" required>
                </div>
                <div class="form-group">
                    <label for="phone">Telefone</label>
                    <input type="tel" id="phone" placeholder="(00) 00000-0000" required>
                </div>
                <div class="form-group">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00" required>
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <div class="password-input">
                        <input type="password" id="password" placeholder="Digite sua senha" required>
                        <button type="button" id="togglePassword" class="toggle-password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirmar senha</label>
                    <div class="password-input">
                        <input type="password" id="confirmPassword" placeholder="Confirme sua senha" required>
                        <button type="button" id="toggleConfirmPassword" class="toggle-password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="userType">Tipo de usuário</label>
                    <select id="userType" required>
                        <option value="morador">Morador</option>
                        <option value="sindico">Síndico</option>
                        <option value="porteiro">Porteiro</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary btn-large">
                    <i class="fas fa-user-plus"></i> Cadastrar
                </button>
            </form>
            <div class="login-link">
                Já tem uma conta? <a href="entrar.html">Entre aqui</a>
            </div>
        </div>
    </div>

    <script src="../scripts/supabase-client.js"></script>
    <script src="../scripts/cadastro.js"></script>
</body>
</html>
