<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Aprovado - Condomit</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../styles/theme.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #eff6ff 0%, #f0fdf4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: var(--text-primary, #111827);
        }
        html[data-theme="dark"] body {
            background: linear-gradient(135deg, #0f172a 0%, #14532d 100%);
        }
        .result-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 56px 48px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 60px rgba(16, 185, 129, 0.15);
        }
        html[data-theme="dark"] .result-card {
            background: #1e293b;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        }
        .logo {
            height: 72px;
            width: auto;
            margin-bottom: 32px;
        }
        .icon-circle {
            width: 96px;
            height: 96px;
            margin: 0 auto 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: popIn 0.5s ease-out;
        }
        .icon-circle i {
            font-size: 44px;
            color: white;
        }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }
        h1 {
            font-size: 1.85rem;
            font-weight: 800;
            color: #065f46;
            margin-bottom: 14px;
        }
        html[data-theme="dark"] h1 { color: #34d399; }
        .subtitle {
            font-size: 1rem;
            color: #6b7280;
            line-height: 1.7;
            margin-bottom: 32px;
        }
        html[data-theme="dark"] .subtitle { color: #94a3b8; }
        .info-box {
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 32px;
            text-align: left;
        }
        html[data-theme="dark"] .info-box {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
        }
        .info-box p {
            font-size: 0.92rem;
            color: #065f46;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            line-height: 1.6;
        }
        html[data-theme="dark"] .info-box p { color: #6ee7b7; }
        .info-box i {
            color: #10b981;
            margin-top: 2px;
            flex-shrink: 0;
        }
        .btn-primary {
            display: inline-block;
            width: 100%;
            padding: 16px 28px;
            background: var(--primary-color, #1e40af);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-primary:hover {
            background: var(--secondary-blue, #1e3a8a);
            transform: translateY(-1px);
        }
        .btn-secondary {
            display: inline-block;
            width: 100%;
            padding: 14px 28px;
            margin-top: 12px;
            background: transparent;
            color: var(--primary-color, #1e40af);
            border: 2px solid var(--border-color, #e5e7eb);
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-secondary:hover {
            border-color: var(--primary-color, #1e40af);
        }
    </style>
</head>
<body>
    <main class="result-card" role="main">
        <img src="../assets/logo-full.png" alt="Condomit Logo" class="logo">
        <div class="icon-circle" aria-hidden="true">
            <i class="fas fa-check"></i>
        </div>
        <h1>Pagamento aprovado</h1>
        <p class="subtitle">
            Seu pagamento foi processado com sucesso. Estamos confirmando a ativação do seu plano.
        </p>
        <div class="info-box">
            <p>
                <i class="fas fa-info-circle"></i>
                A liberação do seu plano pode levar alguns segundos. Caso não tenha acesso imediato, atualize a página ou faça login novamente.
            </p>
        </div>
        <button type="button" class="btn-primary" id="btn-continuar">
            <i class="fas fa-arrow-right"></i> Ir para o Painel
        </button>
        <button type="button" class="btn-secondary" id="btn-voltar-checkout">
            Voltar para Checkout
        </button>
    </main>

    <script>
        (function() {
            function extrairParametros() {
                var params = {};
                try {
                    var usp = new URLSearchParams(window.location.search);
                    usp.forEach(function(v, k) { params[k] = v; });
                } catch (_) {}
                return params;
            }
            var params = extrairParametros();

            if (window.opener && !window.opener.closed) {
                try {
                    window.opener.postMessage({
                        tipo: 'RETORNO_MERCADO_PAGO',
                        status: 'approved',
                        collection_id: params.collection_id || params.payment_id || null,
                        payment_id: params.payment_id || params.collection_id || null,
                        preference_id: params.preference_id || null,
                        external_reference: params.external_reference || null,
                        merchant_order_id: params.merchant_order_id || null
                    }, window.location.origin);
                } catch (err) {
                    console.warn('Não foi possível enviar mensagem para opener:', err.message);
                }
                setTimeout(function() { try { window.close(); } catch (_) {} }, 800);
            }

            document.getElementById('btn-continuar').addEventListener('click', function() {
                window.location.href = 'index.html';
            });
            document.getElementById('btn-voltar-checkout').addEventListener('click', function() {
                window.location.href = 'checkout.html';
            });
        })();
    </script>
</body>
</html>
