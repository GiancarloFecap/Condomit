<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Pagamento aprovado - Condomit</title>
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../styles/theme.css?v=0151">
    <link rel="stylesheet" href="../styles/checkout.css">
    <link rel="stylesheet" href="../styles/responsive-mobile.css?v=029">
  <link rel="manifest" href="../manifest.webmanifest">
</head>
<body class="payment-result-page">
    <main class="payment-result-card success" data-payment-result data-status="approved">
        <div class="payment-result-icon">
            <i class="fas fa-check"></i>
        </div>
        <h1 id="payment-result-title">Pagamento aprovado</h1>
        <p id="payment-result-description">Estamos confirmando os dados finais do seu pagamento.</p>
        <div class="payment-result-status" id="payment-result-status">
            <strong>Status atual</strong>
            <span>Sincronizando retorno do Mercado Pago...</span>
        </div>
        <div class="payment-result-actions">
            <a class="primary" id="payment-result-primary" href="index.html">Ir para o painel</a>
            <a class="secondary" id="payment-result-secondary" href="checkout.html">Voltar ao checkout</a>
            <button class="secondary" id="payment-result-refresh" type="button">Atualizar status</button>
        </div>
    </main>

    <script src="../assets/js/retorno-mercado-pago.js"></script>
    <script src="../scripts/condomit-alerts.js?v=014"></script>
<script src="../scripts/advanced-global.js?v=029"></script>
</body>
</html>
