<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<title>Condomit - Chat</title>
<link href="../assets/favicon.png" rel="icon" type="image/png"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
<link href="../styles/index.css?v=053" rel="stylesheet"/>
<link href="../styles/theme.css?v=044" rel="stylesheet"/>
<link href="../styles/chat.css?v=0726" rel="stylesheet"/>
<link href="../styles/responsive-mobile.css?v=035" rel="stylesheet"/>
<link href="../styles/ux-polish.css?v=0720" rel="stylesheet"/>
<link href="../manifest.webmanifest" rel="manifest"/>
<link href="../styles/sidebar-account-navigation.css?v=056" rel="stylesheet"/>
<meta content="noindex, nofollow" name="robots"/>
<link href="../styles/ui-refinement-071.css" rel="stylesheet"/></head>
<body class="condomit-no-topbar condomit-app-page">
<div class="dashboard-sindico">
<aside class="sidebar"><div class="sidebar-header"><img alt="Condomit Icon" class="sidebar-logo" src="../assets/logo-lado.png"/><h2 class="condo-name" id="sidebarApartment"></h2></div></aside>
<main class="main-content">
<section class="chat-page">
<div class="chat-layout">
<div class="chat-panel conversations">
<div class="conversations-list">
<div class="conversations-header">
<div class="conversations-title-row"><h3>Conversas</h3><button aria-label="Adicionar pessoa" class="new-chat-btn" id="newChatBtn" title="Adicionar pessoa" type="button"><i class="fas fa-plus"></i></button></div>
<div class="search-input-wrapper"><i class="fas fa-search"></i><input class="search-input" id="searchConversations" placeholder="Buscar conversa..." type="text"/></div>
</div>
<div class="conversations-scroll chat-groups" id="conversationsList"></div>
</div>
</div>
<div class="chat-panel chat-main">
<div class="chat-header">
<div class="chat-header-left" id="activeChatHeader">
<div class="chat-avatar-lg" id="activeChatAvatar">--</div>
<div class="chat-header-info"><h3 class="chat-header-name" id="activeChatName">Selecione uma conversa</h3><p class="chat-header-detail" id="activeChatDetail"><span class="status-indicator">Escolha um contato salvo para começar</span></p></div>
</div>
<div class="chat-header-actions chat-options-wrap">
<button aria-label="Mais opções" class="icon-chat-btn" id="chatOptionsBtn" title="Mais opções" type="button"><i class="fas fa-ellipsis-v"></i></button>
<div class="chat-options-menu" hidden="" id="chatOptionsMenu">
<button data-chat-action="clear" type="button"><i class="fas fa-broom"></i> Limpar conversa</button>
<button class="danger" data-chat-action="delete" type="button"><i class="fas fa-trash"></i> Excluir conversa</button>
</div>
</div>
</div>
<div class="messages-container" id="messagesContainer"><div class="chat-start-empty"><i class="fas fa-comments"></i><strong>Nenhuma conversa selecionada</strong><span>Adicione uma pessoa pelo botão + ou selecione uma conversa salva.</span></div></div>
<div class="chat-input-area">
<div class="chat-input-wrapper"><button class="chat-tool-btn" id="attachFileBtn" title="Anexar arquivo" type="button"><i class="fas fa-paperclip"></i></button><textarea class="chat-textarea" disabled="" id="chatInput" placeholder="Digite sua mensagem..." rows="1"></textarea><button class="chat-tool-btn chat-emoji-btn" id="emojiBtn" title="Emoji" type="button"><i class="fas fa-face-smile"></i></button><button class="chat-send-btn" disabled="" id="sendBtn" title="Enviar" type="button"><i class="fas fa-paper-plane"></i></button></div>
</div>
</div>
</div>
</section>
</main>
</div>
<div aria-hidden="true" class="chat-contact-modal" id="chatContactModal">
<div aria-labelledby="chatContactTitle" aria-modal="true" class="chat-contact-card" role="dialog">
<div class="chat-contact-head"><div><span>Nova conversa</span><h2 id="chatContactTitle">Adicionar pessoa</h2><p>Escolha quem deverá aparecer na sua barra lateral.</p></div><button aria-label="Fechar" id="closeChatContactModal" type="button"><i class="fas fa-xmark"></i></button></div>
<div class="chat-contact-search"><i class="fas fa-search"></i><input id="chatContactSearch" placeholder="Buscar pessoa..." type="search"/></div>
<div class="chat-contact-list" id="chatContactList"></div>
</div>
</div>
<script src="../scripts/platform-config.js?v=035"></script>
<script src="../scripts/supabase-client.js?v=065"></script>
<script src="../scripts/supabase-auth.js?v=061" type="module"></script>
<script src="../scripts/sidebar-links.js?v=065"></script>
<script src="../scripts/chat-core.js?v=0725"></script>
<script src="../scripts/topbar-actions.js?v=065"></script>
<script src="../scripts/condomit-alerts.js?v=057"></script>
<script src="../scripts/responsive-nav.js?v=025"></script>
<script src="../scripts/advanced-global.js?v=065"></script>
</body>
</html>
