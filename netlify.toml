[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@getbrevo/brevo"]

[[redirects]]
  from = "/esqueceu-senha"
  to = "/.netlify/functions/api-proxy/esqueceu-senha"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api-proxy/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/pages/redefinir-senha.html"
  to = "/pages/redefinir-senha.html"
  status = 200

[[redirects]]
  from = "/pages/*"
  to = "/pages/:splat"
  status = 200

[[redirects]]
  from = "/scripts/*"
  to = "/scripts/:splat"
  status = 200

[[redirects]]
  from = "/styles/*"
  to = "/styles/:splat"
  status = 200

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/netlify/*"
  to = "/netlify/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/inicio.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(self), camera=(self), display-capture=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://esm.sh https://sdk.mercadopago.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' data: https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'self' https://*.mercadopago.com https://mercadopago.com; upgrade-insecure-requests"


# A função desperta a cada 5 minutos; a RPC controla individualmente o intervalo de 30 minutos por assembleia.
[functions."auto-end-assemblies"]
  schedule = "*/5 * * * *"

[[headers]]
  for = "/privacidade.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/excluir-conta.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/suporte.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"
