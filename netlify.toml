[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@getbrevo/brevo"]

[[redirects]]
  from = "/esqueceu-senha"
  to = "/.netlify/functions/api-proxy/esqueceu-senha"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api-proxy/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/pages/redefinir-senha.html"
  to = "/pages/redefinir-senha.html"
  status = 200

[[redirects]]
  from = "/pages/*"
  to = "/pages/:splat"
  status = 200

[[redirects]]
  from = "/scripts/*"
  to = "/scripts/:splat"
  status = 200

[[redirects]]
  from = "/styles/*"
  to = "/styles/:splat"
  status = 200

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/netlify/*"
  to = "/netlify/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/inicio.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(self), camera=(self), display-capture=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PATCH, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization, apikey"
    Access-Control-Max-Age = "86400"

[[headers]]
  for = "/api/*"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PATCH, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization, apikey"
    Access-Control-Max-Age = "86400"
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate"

# Verifica periodicamente assembleias que passaram 30 minutos sem participantes ativos.
[functions."auto-end-assemblies"]
  schedule = "*/5 * * * *"
