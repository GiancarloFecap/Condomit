<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Condomit — Sem conexão</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7fb;font-family:Inter,Arial,sans-serif;color:#172033;padding:24px}.card{width:min(520px,100%);background:#fff;border:1px solid #dce5f2;border-radius:24px;padding:34px;text-align:center;box-shadow:0 20px 55px rgba(26,57,110,.12)}img{width:190px;max-width:60%;margin-bottom:20px}.icon{width:72px;height:72px;border-radius:22px;margin:0 auto 18px;background:#edf3ff;color:#2252bd;display:grid;place-items:center;font-size:34px}.card h1{font-size:24px;margin:0 0 10px}.card p{color:#63708a;line-height:1.6;margin:0 0 24px}button{border:0;border-radius:14px;background:#2252bd;color:#fff;font-weight:700;font-size:15px;padding:13px 22px;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <img src="../assets/logo-lado.png" alt="Condomit">
    <div class="icon">⌁</div>

    <p>O aplicativo desktop precisa de internet para acessar os dados do condomínio. Verifique sua conexão e tente novamente.</p>
    <button onclick="location.reload()">Tentar novamente</button>
