<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0A2A6B">
  <title>Condomit • Trocar tipo de usuário</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../styles/acesso-demonstracao.css?v=0725">
</head>
<body>
  <main class="demo-shell">
    <header class="demo-topbar">
      <a href="perfil.html" class="demo-back"><i class="fas fa-arrow-left"></i> Voltar ao perfil</a>
      <img src="../assets/logo-condomit-auth-hq.png" alt="Condomit" class="demo-logo">
      <span class="demo-login">Conta administrativa</span>
    </header>

    <section class="demo-hero">
      <span class="demo-kicker">CONTA ADMINISTRATIVA</span>
      <h1>Trocar tipo de usuário</h1>
      <p>Escolha Morador, Síndico ou Porteiro para visualizar a Condomit com as permissões desse perfil.</p>
      <div class="demo-note"><i class="fas fa-shield-halved"></i><span>Esta opção é exclusiva da conta administrativa autorizada.</span></div>
    </section>

    <section class="demo-role-grid" aria-label="Tipos de usuário">
      <button class="demo-role-card" type="button" data-demo-role="morador">
        <span class="demo-role-icon"><i class="fas fa-house-user"></i></span>
        <span class="demo-role-copy"><strong>Morador</strong><small>Avisos, reservas, marketplace, sugestões e comunicação.</small></span>
        <i class="fas fa-arrow-right"></i>
      </button>
      <button class="demo-role-card" type="button" data-demo-role="sindico">
        <span class="demo-role-icon"><i class="fas fa-user-tie"></i></span>
        <span class="demo-role-copy"><strong>Síndico</strong><small>Gestão do condomínio, moradores, assembleias e ferramentas administrativas.</small></span>
        <i class="fas fa-arrow-right"></i>
      </button>
      <button class="demo-role-card" type="button" data-demo-role="porteiro">
        <span class="demo-role-icon"><i class="fas fa-user-shield"></i></span>
        <span class="demo-role-copy"><strong>Porteiro</strong><small>Portaria, acessos, visitantes, encomendas e comunicação.</small></span>
        <i class="fas fa-arrow-right"></i>
      </button>
    </section>

    <div class="demo-status" id="demoStatus" role="status" aria-live="polite"></div>
  </main>

  <script src="../scripts/platform-config.js?v=035"></script>
  <script src="../scripts/supabase-client.js?v=0710"></script>
  <script type="module" src="../scripts/supabase-auth.js?v=036"></script>
  <script src="../scripts/condomit-alerts.js?v=014"></script>
  <script src="../scripts/acesso-demonstracao.js?v=073"></script>
</body>
</html>
