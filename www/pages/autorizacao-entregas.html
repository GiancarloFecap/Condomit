<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Condomit - Autorização de Entregas</title>
<link href="../assets/favicon.png" rel="icon" type="image/png"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
<link href="../styles/index.css?v=053" rel="stylesheet"/>
<link href="../styles/theme.css?v=044" rel="stylesheet"/>
<link href="../styles/porteiro-acessos.css?v=064" rel="stylesheet"/>
<link href="../styles/responsive-mobile.css?v=035" rel="stylesheet"/>
<link href="../manifest.webmanifest" rel="manifest"/>
<link href="../styles/package-advanced-027.css?v=035" rel="stylesheet"/>
<link href="../styles/ux-polish.css?v=0720" rel="stylesheet"/>
<link href="../styles/sidebar-account-navigation.css?v=056" rel="stylesheet"/>
<meta content="noindex, nofollow" name="robots"/>
<link href="../styles/ui-refinement-071.css" rel="stylesheet"/></head>
<body class="condomit-no-topbar condomit-app-page">
<div class="dashboard-sindico">
<aside class="sidebar porteiro-sidebar">
<div class="sidebar-header">
<img alt="Condomit Icon" class="sidebar-logo" src="../assets/logo-lado.png"/>
<h2 class="condo-name" id="sidebarApartment"></h2>
</div>
</aside>
<main class="main-content">
<section class="access-page condomit-metrics-compact">
<div class="metrics-row">
<article class="metric-card success">
<div class="metric-head">
<div class="metric-icon"><i class="fas fa-truck"></i></div>
<div>
<div class="metric-label">Aguardando retirada</div>
<div class="metric-value" id="activeDeliveriesCount">0</div>
</div>
</div>

</article>
<article class="metric-card accent">
<div class="metric-head">
<div class="metric-icon"><i class="fas fa-clock"></i></div>
<div>
<div class="metric-label">Recebidas hoje</div>
<div class="metric-value" id="scheduledTodayCount">0</div>
</div>
</div>

</article>
<article class="metric-card pending">
<div class="metric-head">
<div class="metric-icon"><i class="fas fa-circle-check"></i></div>
<div>
<div class="metric-label">Retiradas hoje</div>
<div class="metric-value" id="completedTodayCount">0</div>
</div>
</div>

</article>
<article class="metric-card danger">
<div class="metric-head">
<div class="metric-icon"><i class="fas fa-circle-xmark"></i></div>
<div>
<div class="metric-label">Devolvidas hoje</div>
<div class="metric-value" id="canceledTodayCount">0</div>
</div>
</div>

</article>
</div>
<section class="panel-card">
<div class="toolbar">
<div class="toolbar-left">
<label class="search-field">
<i class="fas fa-magnifying-glass"></i>
<input id="deliverySearchInput" placeholder="Buscar por morador, entrega ou código..." type="search"/>
</label>
</div>
<div class="toolbar-right">
<label class="select-field">
<select id="deliveryStatusFilter">
<option value="all">Todos os status</option>
<option value="pending">Aguardando retirada</option>
<option value="picked">Retiradas</option>
<option value="returned">Devolvidas</option>
</select>
</label>
<label class="select-field">
<select id="deliveryBlockFilter">
<option value="all">Todos os blocos</option>
</select>
</label>
<label class="date-field">
<i class="fas fa-calendar-day"></i>
<input id="deliveryDateFilter" type="date"/>
</label>
<button class="filter-btn" id="clearDeliveryFiltersBtn" type="button">
<i class="fas fa-filter-circle-xmark"></i>
<span>Limpar filtros</span>
</button>
</div>
</div>
<div class="status-tabs" id="deliveryTabs">
<button class="status-tab active" data-tab="all" type="button">Todas</button>
<button class="status-tab" data-tab="pending" type="button">Aguardando retirada</button>
<button class="status-tab" data-tab="picked" type="button">Retiradas</button>
<button class="status-tab" data-tab="returned" type="button">Devolvidas</button>
</div>
<div class="table-wrap">
<table class="access-table">
<thead>
<tr>
<th>Entrega</th>
<th>Morador</th>
<th>Unidade</th>
<th>Transportadora</th>
<th>Recebida em</th>
<th>Recebido por</th>
<th>Status</th>
<th>Ações</th>
</tr>
</thead>
<tbody id="deliveryTableBody"></tbody>
</table>
</div>
</section>
</section>
</main>
</div>
<div aria-hidden="true" class="modal-backdrop delivery-modal" id="deliveryModal">
<div aria-labelledby="deliveryModalTitle" aria-modal="true" class="delivery-modal-card" role="dialog">
<div class="delivery-modal-header">
<div>
<h2 id="deliveryModalTitle">Registrar encomenda</h2>
<p>Registre uma entrega para o condomínio atual.</p>
</div>
<button aria-label="Fechar modal" class="icon-more" id="closeDeliveryModalBtn" type="button">
<i class="fas fa-times"></i>
</button>
</div>
<div class="delivery-modal-body">
<form class="delivery-form" id="deliveryForm">
<div class="delivery-form-row">
<label>
<span>Morador</span>
<input id="deliveryResidentName" placeholder="Nome do morador" required="" type="text"/>
</label>
<label>
<span>Código da entrega</span>
<input id="deliveryCode" placeholder="Ex: PED-12345" required="" type="text"/>
</label>
</div>
<div class="delivery-form-row">
<label>
<span>Apartamento</span>
<input id="deliveryApartment" placeholder="Ex: 203" required="" type="text"/>
</label>
<label>
<span>Bloco</span>
<input id="deliveryBlock" placeholder="Ex: A" required="" type="text"/>
</label>
</div>
<div class="delivery-form-row">
<label>
<span>Transportadora</span>
<input id="deliveryCarrier" placeholder="Ex: Mercado Envios" required="" type="text"/>
</label>
<label>
<span>Categoria</span>
<select id="deliveryType" required="">
<option value="store">Loja</option>
<option value="marketplace">Marketplace</option>
<option value="food">Delivery</option>
<option value="service">Serviço</option>
<option value="other">Outros</option>
</select>
</label>
</div>
<div class="delivery-form-row">
<label>
<span>Data prevista</span>
<input id="deliveryDate" required="" type="date"/>
</label>
<label>
<span>Janela de entrega</span>
<input id="deliveryWindow" placeholder="Ex: 14:00 - 18:00" required="" type="text"/>
</label>
</div>
<label>
<span>Observações</span>
<textarea id="deliveryNotes" placeholder="Informações adicionais sobre a entrega"></textarea>
</label>
<div class="delivery-feedback" id="deliveryFeedback"></div>
<div class="delivery-modal-actions">
<button class="ghost-outline" id="cancelDeliveryBtn" type="button">Cancelar</button>
<button class="soft-action" type="submit">
<i class="fas fa-check"></i>
<span>Salvar autorização</span>
</button>
</div>
</form>
</div>
</div>
</div>
<script src="../scripts/platform-config.js?v=035"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="../scripts/supabase-client.js?v=065"></script>
<script src="../scripts/sidebar-links.js?v=065"></script>
<script src="../scripts/porteiro-topbar.js?v=035"></script>
<script src="../scripts/autorizacao-entregas.js?v=035"></script>
<script src="../scripts/topbar-actions.js?v=065"></script>
<script src="../scripts/condomit-alerts.js?v=057"></script>
<script src="../scripts/responsive-nav.js?v=025"></script>
<script src="../scripts/advanced-global.js?v=065"></script>
</body>
</html>
