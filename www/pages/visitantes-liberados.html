<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Condomit - Visitantes Liberados</title>
<link href="../assets/favicon.png" rel="icon" type="image/png"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
<link href="../styles/index.css?v=053" rel="stylesheet"/>
<link href="../styles/theme.css?v=044" rel="stylesheet"/>
<link href="../styles/visitantes-liberados.css?v=035" rel="stylesheet"/>
<link href="../styles/responsive-mobile.css?v=035" rel="stylesheet"/>
<link href="../manifest.webmanifest" rel="manifest"/>
<link href="../styles/ux-polish.css?v=0720" rel="stylesheet"/>
<link href="../styles/sidebar-account-navigation.css?v=056" rel="stylesheet"/>
<meta content="noindex, nofollow" name="robots"/>
<link href="../styles/ui-refinement-071.css" rel="stylesheet"/></head>
<body class="condomit-no-topbar condomit-app-page">
<div class="dashboard-sindico">
<aside class="sidebar">
<div class="sidebar-header">
<img alt="Condomit Icon" class="sidebar-logo" src="../assets/logo-lado.png"/>
<h2 class="condo-name" id="sidebarApartment"></h2>
</div>
</aside>
<main class="main-content">
<section class="visitantes-liberados-page">
<div class="metrics-row-three">
<article class="metric-card-3 metric-success">
<div class="metric-card-content">
<div class="metric-icon-green"><i class="fas fa-user-check"></i></div>
<div>
<div class="metric-label">Visitantes liberados hoje</div>
<div class="metric-value" id="todayReleasedCount">0</div>
<div class="metric-caption metric-caption-green"><span class="dot-green"></span> Acessos válidos</div>
</div>
</div>
</article>
<article class="metric-card-3 metric-purple">
<div class="metric-card-content">
<div class="metric-icon-purple"><i class="fas fa-calendar-check"></i></div>
<div>
<div class="metric-label">Próximos acessos</div>
<div class="metric-value" id="upcomingCount">0</div>
<div class="metric-caption metric-caption-purple"><span class="dot-purple"></span> Agendados</div>
</div>
</div>
</article>
<article class="metric-card-3 metric-blue">
<div class="metric-card-content">
<div class="metric-icon-blue"><i class="fas fa-id-card"></i></div>
<div>
<div class="metric-label">Total liberados (mês)</div>
<div class="metric-value" id="monthCount">0</div>
<div class="metric-caption metric-caption-blue"><span class="dot-blue"></span> <span id="mesReferencia">Maio/2024</span></div>
</div>
</div>
</article>
</div>
<div class="filters-row">
<div class="search-input-wrap refined-search-wrap">
<i class="fas fa-search search-icon"></i>
<input id="searchInput" placeholder="Buscar por nome, documento ou responsável..." type="text"/>
</div>
<select class="filter-select" id="blockSelect">
<option value="">Todos os blocos</option>
</select>
<select class="filter-select" id="dateSelect">
<option selected="" value="all">Todos os liberados</option>
<option value="7">Hoje até 7 dias</option>
<option value="15">Hoje até 15 dias</option>
<option value="30">Hoje até 30 dias</option>
</select>
<button class="btn-filter-extra" id="btnFiltros" type="button">
<i class="fas fa-filter"></i> Filtros
                    </button>
</div>
<div class="table-card">
<div class="table-wrap">
<table class="visitantes-table">
<thead>
<tr>
<th>Visitante</th>
<th>Documento</th>
<th>Responsável</th>
<th>Unidade</th>
<th>Data e Horário</th>
<th>Motivo da Visita</th>
<th>Status</th>
<th>Ações</th>
</tr>
</thead>
<tbody id="visitantesTableBody">
</tbody>
</table>
</div>
<div class="table-footer">
<div class="table-info" id="tableInfo">Mostrando 1 a 7 de 19 visitantes</div>
<div class="table-pagination">
<button aria-label="Página anterior" class="page-btn" id="prevPageBtn" type="button">
<i class="fas fa-chevron-left"></i>
</button>
<button class="page-btn page-btn-active" data-page="1" type="button">1</button>
<button class="page-btn" data-page="2" type="button">2</button>
<button class="page-btn" data-page="3" type="button">3</button>
<button aria-label="Mais páginas" class="page-btn" type="button">...</button>
<button aria-label="Próxima página" class="page-btn" id="nextPageBtn" type="button">
<i class="fas fa-chevron-right"></i>
</button>
</div>
<div class="page-size-wrap">
<select class="page-size-select" id="pageSizeSelect">
<option value="7">7 por página</option>
<option value="10">10 por página</option>
<option value="15">15 por página</option>
<option value="30">30 por página</option>
</select>
</div>
</div>
</div>
</section>
<div aria-atomic="true" aria-live="polite" class="toast-container" id="toast-container"></div>
</main>
</div>
<script src="../scripts/platform-config.js?v=035"></script>
<script src="../scripts/supabase-client.js?v=065"></script>
<script src="../scripts/community-hub.js?v=065"></script>
<script src="../scripts/sidebar-links.js?v=065"></script>
<script src="../scripts/i18n.js"></script>
<script src="../scripts/visitantes-liberados.js?v=035"></script>
<script src="../scripts/topbar-actions.js?v=065"></script>
<script src="../scripts/condomit-alerts.js?v=057"></script>
<script src="../scripts/responsive-nav.js?v=025"></script>
<script src="../scripts/advanced-global.js?v=065"></script>
</body>
</html>
