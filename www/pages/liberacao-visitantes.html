<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Condomit - Liberação de Visitantes</title>
<link href="../assets/favicon.png" rel="icon" type="image/png"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
<link href="../styles/index.css?v=053" rel="stylesheet"/>
<link href="../styles/theme.css?v=044" rel="stylesheet"/>
<link href="../styles/porteiro-acessos.css?v=065" rel="stylesheet"/>
<link href="../styles/registrar-visitantes.css?v=065" rel="stylesheet"/>
<link href="../styles/visitor-registration-modal.css?v=065" rel="stylesheet"/>
<link href="../styles/responsive-mobile.css?v=035" rel="stylesheet"/>
<link href="../manifest.webmanifest" rel="manifest"/>
<link href="../styles/ux-polish.css?v=0720" rel="stylesheet"/>
<link href="../styles/sidebar-account-navigation.css?v=056" rel="stylesheet"/>
<meta content="noindex, nofollow" name="robots"/>
<link href="../styles/ui-refinement-071.css" rel="stylesheet"/></head>
<body class="condomit-no-topbar condomit-app-page">
<div class="dashboard-sindico">
<aside class="sidebar porteiro-sidebar">
<div class="sidebar-header">
<img alt="Condomit Icon" class="sidebar-logo" src="../assets/logo-lado.png"/>
<h2 class="condo-name" id="sidebarApartment"></h2>
</div>
</aside>
<main class="main-content">
<section class="access-page">
<div class="metrics-row">
<article class="metric-card pending">
<div class="metric-head">
<div class="metric-icon"><i class="fas fa-clock-rotate-left"></i></div>
<div>
<div class="metric-label">Aguardando liberação</div>
<div class="metric-value" id="pendingVisitorsCount">0</div>
</div>
</div>
<div class="metric-caption">Visitantes</div>
</article>
<article class="metric-card success">
<div class="metric-head">
<div class="metric-icon"><i class="fas fa-circle-check"></i></div>
<div>
<div class="metric-label">Liberados hoje</div>
<div class="metric-value" id="approvedVisitorsCount">0</div>
</div>
</div>
<div class="metric-caption">Visitantes</div>
</article>
<article class="metric-card danger">
<div class="metric-head">
<div class="metric-icon"><i class="fas fa-circle-xmark"></i></div>
<div>
<div class="metric-label">Recusados hoje</div>
<div class="metric-value" id="rejectedVisitorsCount">0</div>
</div>
</div>
<div class="metric-caption">Visitantes</div>
</article>
<article class="metric-card accent">
<div class="metric-head">
<div class="metric-icon"><i class="fas fa-users"></i></div>
<div>
<div class="metric-label">Total hoje</div>
<div class="metric-value" id="todayVisitorsTotal">0</div>
</div>
</div>
<div class="metric-caption">Visitantes</div>
</article>
</div>
<div class="access-layout">
<section class="access-main panel-card">
<div class="release-register-action">
<button class="release-register-button" id="openVisitorRegistrationBtn" type="button">
<i aria-hidden="true" class="fas fa-user-plus"></i><span>Registrar visitante</span>
</button>
</div>
<div class="status-tabs" id="releaseTabs">
<button class="status-tab active" data-tab="pending" type="button">Aguardando liberação <span class="count-pill" id="tabPendingCount">0</span></button>
<button class="status-tab" data-tab="approved" type="button">Liberados <span class="count-pill" id="tabApprovedCount">0</span></button>
<button class="status-tab" data-tab="rejected" type="button">Recusados <span class="count-pill" id="tabRejectedCount">0</span></button>
</div>
<div class="toolbar">
<div class="toolbar-left">
<label class="search-field">
<i class="fas fa-magnifying-glass"></i>
<input id="releaseSearchInput" placeholder="Buscar por nome do visitante ou responsável..." type="search"/>
</label>
</div>
<div class="toolbar-right">
<label class="select-field">
<select id="releaseBlockFilter">
<option value="all">Todos os blocos</option>
</select>
</label>
<label class="select-field">
<select id="releasePeriodFilter">
<option value="all">Todos os períodos</option>
<option value="today">Hoje</option>
<option value="7d">Últimos 7 dias</option>
<option value="30d">Últimos 30 dias</option>
</select>
</label>
<button class="filter-btn" id="clearReleaseFiltersBtn" type="button">
<i class="fas fa-filter-circle-xmark"></i>
<span>Limpar filtros</span>
</button>
</div>
</div>
<div class="request-list" id="visitorReleaseList"></div>
</section>
<aside class="sidebar-stack">

<section class="side-card">
<h3>Atividade de hoje</h3>
<div aria-hidden="true" class="donut-chart" id="releaseDonutChart"></div>
<ul class="summary-legend">
<li><span class="legend-label"><span class="legend-dot" style="background:#0ea5a4;"></span>Liberados</span><strong id="legendApprovedCount">0</strong></li>
<li><span class="legend-label"><span class="legend-dot" style="background:#f59e0b;"></span>Aguardando</span><strong id="legendPendingCount">0</strong></li>
<li><span class="legend-label"><span class="legend-dot" style="background:#ef4444;"></span>Recusados</span><strong id="legendRejectedCount">0</strong></li>
</ul>
</section>

</aside>
</div>
</section>
</main>
</div>
<div aria-hidden="true" class="visitor-registration-overlay" id="visitorRegistrationModal">
<section aria-labelledby="visitorRegistrationDialogTitle" aria-modal="true" class="visitor-registration-dialog" role="dialog" tabindex="-1">
<div class="visitor-registration-dialog-head">
<div><h2 id="visitorRegistrationDialogTitle">Registrar visitante</h2><p>Informe os dados do visitante e do morador responsável.</p></div>
<button aria-label="Fechar cadastro" class="visitor-registration-close" id="closeVisitorRegistrationBtn" type="button"><i aria-hidden="true" class="fas fa-xmark"></i></button>
</div>
<div class="visitor-registration-dialog-body">
<form class="visitor-form" id="visitorRegistrationForm">
<div class="form-row form-row-3">
<label>
<span>Nome completo</span>
<input data-field="visitor-full-name" placeholder="Digite o nome completo" required="" type="text">
</input></label>
<label>
<span>CPF</span>
<input data-field="visitor-cpf" placeholder="Digite o CPF" required="" type="text"/>
</label>
<label>
<span>RG</span>
<input data-field="visitor-rg" placeholder="Digite o RG" required="" type="text"/>
</label>
</div>
<div class="form-row form-row-2">
<label>
<span>Telefone do visitante</span>
<input data-field="visitor-phone" placeholder="(11) 99999-9999" type="text"/>
</label>
<label>
<span>E-mail</span>
<input data-field="visitor-email" placeholder="visitante@email.com" type="email"/>
</label>
</div>
<div class="form-row form-row-2">
<label class="full-width">
<span>CPF do responsável</span>
<input data-field="responsible-cpf" placeholder="Digite o CPF do responsável" required="" type="text"/>
</label>
</div>
<div class="form-row form-row-2 responsible-grid">
<label>
<span>Nome do responsável</span>
<input data-field="responsible-name" placeholder="Digite o nome do responsável" readonly="" type="text"/>
</label>
<label>
<span>Telefone do responsável</span>
<input data-field="responsible-phone" placeholder="(11) 99999-9999" readonly="" type="text"/>
</label>
<label>
<span>Apartamento</span>
<input data-field="responsible-apartment" placeholder="Ex: 101" readonly="" type="text"/>
</label>
<label>
<span>Bloco</span>
<input data-field="responsible-block" placeholder="Ex: A" readonly="" type="text"/>
</label>
</div>
<div class="visitor-feedback" data-role="visitor-feedback"></div>
<div class="form-actions">
<button class="ghost-btn" data-action="cancel-visitor" type="button">
<span>Cancelar</span>
</button>
<button class="primary-action" data-action="submit-visitor" type="submit">
<i class="fas fa-id-badge"></i>
<span>Registrar visitante</span>
</button>
</div>
</form>
</div>
</section>
</div>
<script src="../scripts/platform-config.js?v=035"></script>
<script src="../scripts/supabase-client.js?v=065"></script>
<script src="../scripts/sidebar-links.js?v=065"></script>
<script src="../scripts/porteiro-topbar.js?v=035"></script>
<script src="../scripts/visitor-registration.js?v=065"></script>
<script src="../scripts/liberacao-visitantes.js?v=065"></script>
<script src="../scripts/topbar-actions.js?v=065"></script>
<script src="../scripts/condomit-alerts.js?v=057"></script>
<script src="../scripts/responsive-nav.js?v=025"></script>
<script src="../scripts/advanced-global.js?v=065"></script>
</body>
</html>
